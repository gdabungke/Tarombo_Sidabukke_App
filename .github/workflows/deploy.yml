name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [ main ] # Akan berjalan otomatis setiap kali Anda push ke branch main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies and Build
        run: |
          npm install
          npm run build
        working-directory: ./frontend # Masuk ke folder frontend tempat kode React/Vite berada

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist # Mengambil hasil build dari folder dist frontend
          publish_branch: gh-pages